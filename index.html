<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ropa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Catálogo de Ropa Muhammad</h1>
        <p>Selecciona una categoría o busca tu prenda</p>
        <input type="text" id="buscador" placeholder="Buscar por nombre o ID (ej. CAM-BAS)...">

    <!-- Barra de Categorías -->
    <nav id="menu-categorias" class="menu-categorias">
        <!-- Los botones de categorías se generan aquí automáticamente -->
    </nav>

    <main>
        <div id="catalogo-container" class="grid-productos"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
